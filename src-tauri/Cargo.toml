[package]
name = "app"
version = "1.7.2"
description = "KARSA — Kertas Anggaran Sekolah (RKAS) Desktop"
authors = ["KARSA"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
# Provider kripto untuk reqwest (fitur rustls-no-provider dipakai bersama crate
# lain). Tanpa ini `reqwest::Client::build()` panic dan dialog simpan tidak muncul.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures-util = "0.3"
tauri-plugin-dialog = "2"

# Windows Job Object: memastikan php.exe ikut mati saat KARSA berhenti,
# sehingga folder instalasi tidak terkunci ketika aplikasi diperbarui.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
