[package]
name = "app"
version = "1.5.0"
description = "KARSA — Kertas Anggaran Sekolah (RKAS) Desktop"
authors = ["KARSA"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
futures-util = "0.3"
rfd = { version = "0.16", default-features = false }
